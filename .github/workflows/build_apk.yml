name: Build APK Zeus Eq Pro

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Para que puedas ejecutarlo manual cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILDOZER_MEMORY_LIMIT: 4096
      PYTHONUNBUFFERED: 1
    steps:
      - name: 📥 Clonar código
        uses: actions/checkout@v4

      - name: 🐍 Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Instalar dependencias del sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
              build-essential git python3-pip python3-dev \
              openjdk-17-jdk unzip zip libncurses5-dev libncursesw5-dev \
              cmake libffi-dev libssl-dev automake libtool pkg-config \
              libtinfo6  # ← Aquí está el cambio: usamos la versión nueva
          # Enlace simbólico para que Buildozer encuentre la librería
          sudo ln -s /usr/lib/$(uname -m)-linux-gnu/libtinfo.so.6 /usr/lib/$(uname -m)-linux-gnu/libtinfo.so.5


      - name: 🛠️ Instalar Buildozer y Cython
        run: |
          python -m pip install --upgrade pip
          pip install --user buildozer==1.5.0 cython==0.29.37
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 🚀 Compilar APK
        run: buildozer android debug --verbose

      - name: 📤 Subir APK compilada
        uses: actions/upload-artifact@v4
        with:
          name: Zeus-Eq-Pro-APK
          path: bin/*.apk
          retention-days: 15
