name: Build APK Zeus Eq Pro

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      BUILDOZER_MEMORY_LIMIT: 4096
      PYTHONUNBUFFERED: 1
      ANDROID_HOME: $HOME/.buildozer/android/platform/android-sdk
    steps:
      - name: 📥 Clonar código
        uses: actions/checkout@v4

      - name: 🐍 Instalar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Instalar dependencias del sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
              build-essential git python3-pip python3-dev \
              openjdk-17-jdk unzip zip libncurses5-dev libncursesw5-dev \
              libtinfo6 cmake libffi-dev libssl-dev automake libtool pkg-config
          sudo ln -sf /usr/lib/$(uname -m)-linux-gnu/libtinfo.so.6 /usr/lib/$(uname -m)-linux-gnu/libtinfo.so.5

      - name: 🛠️ Instalar Buildozer y Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --user buildozer==1.5.0 cython==0.29.33
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: ✅ Aceptar licencias de Android
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license

      - name: 🚀 Compilar APK
        run: buildozer android debug --verbose

      - name: 📤 Subir APK compilada
        uses: actions/upload-artifact@v4
        with:
          name: Zeus-Eq-Pro-APK
          path: bin/*.apk
          retention-days: 15
