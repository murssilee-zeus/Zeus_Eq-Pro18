name: Build Zeus EQ Pro APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev openjdk-17-jdk zip unzip git ccache libbz2-dev libsqlite3-dev zlib1g-dev libncurses5-dev
          pip install --upgrade pip
          pip install buildozer Cython==0.29.36
      - name: Clean cache
        run: rm -rf .buildozer ~/.buildozer
      - name: Build APK
        run: buildozer -v android debug
