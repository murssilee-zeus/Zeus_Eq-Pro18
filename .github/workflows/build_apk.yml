name: Build Zeus EQ Pro APK
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev libbz2-dev libsqlite3-dev zlib1g-dev libncurses5-dev libncursesw5-dev liblzo2-dev liblzma-dev python3-dev openjdk-17-jdk zip unzip git ccache autoconf automake libtool pkg-config
          pip install --upgrade pip wheel setuptools
          pip install Cython==0.29.36 buildozer
      - name: Clean cache
        run: |
          rm -rf .buildozer
          rm -rf /home/runner/.buildozer
      - name: Build APK
        run: |
          buildozer -v android debug
